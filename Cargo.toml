[package]
name = "enterprise_pw_demo"
version = "0.1.0"
edition = "2024"
readme = "README.md"
authors = ["Glenn Gore <glenn@affinidi.com>"]

[[bin]]
name = "service"
path = "src/bin/service/main.rs"

[[bin]]
name = "client"
path = "src/bin/client/main.rs"

[dependencies]
affinidi-tdk = "0.2"

anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
console = "0.16"
dialoguer = "0.12"
serde = "1.0"
serde_json = "1.0"
tracing = { version = "0.1", features = ["valuable"] }
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt",
  "json",
  "valuable",
] }
tokio = { version = "1.47", features = [] }
uuid = { version = "1.18", features = ["v4", "fast-rng"] }
